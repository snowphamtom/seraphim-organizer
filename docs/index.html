<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>SERAPHIM DESK · Offline Hex Sorter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --void:#000000;
  --ink:#e8f4ff;
  --mute:#7a9ab8;
  --admit:#7dffb0;
  --refuse:#ff6ad5;
  --cyan:#40f0ff;
  --mag:#ff4ec8;
  --warn:#ffb84d;
  --glass:rgba(6,10,18,0.28);
  --glass-hi:rgba(8,14,24,0.35);
  --line-c:rgba(64,240,255,0.38);
  --line-m:rgba(255,78,200,0.32);
  --line:rgba(120,200,255,0.22);
}
html,body{height:100%;background:var(--void);color:var(--ink);
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* FULL-BLEED VOID — canvas is the desk */
#fx{position:fixed;inset:0;width:100vw;height:100vh;display:block;z-index:0;
  cursor:grab;touch-action:none;background:#000}
#fx.panning{cursor:grabbing}

/* FLOATING INSTRUMENTS — translucent over canvas, no prison rails */
#top{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:10;
  display:flex;align-items:center;gap:.65rem;padding:.28rem .85rem;
  width:min(920px,calc(100vw - 28px));
  background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line-c);border-radius:999px;
  box-shadow:0 0 24px rgba(64,240,255,0.08),inset 0 0 20px rgba(64,240,255,0.03);
  min-width:0;overflow:hidden}
#top .title{font-size:.68rem;letter-spacing:.22em;font-weight:800;white-space:nowrap;
  text-shadow:0 0 14px rgba(255,80,200,.65),0 0 22px rgba(64,240,255,.4)}
.chips{display:flex;gap:.28rem;flex-shrink:0}
.chip{font-size:.5rem;letter-spacing:.1em;padding:.16rem .4rem;border-radius:999px;
  border:1px solid var(--line);background:rgba(0,0,0,0.25);color:#9ab;white-space:nowrap}
.chip.live{border-color:rgba(125,255,176,.5);color:var(--admit);box-shadow:0 0 12px rgba(125,255,176,.25)}
.chip.off{border-color:rgba(64,240,255,.4);color:var(--cyan)}
.chip.hex{border-color:rgba(255,106,213,.45);color:#ff9ad8}
.metrics{display:flex;gap:.55rem;align-items:center;margin-left:.25rem;font-size:.58rem;
  font-family:ui-monospace,monospace;flex-wrap:nowrap;min-width:0;overflow:hidden}
.metrics span{white-space:nowrap;color:var(--mute)}
.metrics b{color:var(--ink);font-weight:700}
.metrics .a b{color:var(--admit)}.metrics .v b{color:var(--refuse)}
.metrics .seal-on b{color:var(--admit)}.metrics .seal-off b{color:var(--refuse)}
.law{margin-left:auto;font-size:.46rem;color:#4a6070;font-family:ui-monospace,monospace;
  white-space:nowrap;opacity:.75}
.law b{color:#6a9}

#left{position:fixed;left:12px;top:58px;bottom:148px;width:min(248px,28vw);z-index:10;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line-c);border-radius:12px;
  box-shadow:0 0 28px rgba(64,240,255,0.07),inset 0 0 30px rgba(0,0,0,0.15);
  min-height:0;overflow:auto;pointer-events:auto}
#right{position:fixed;right:12px;top:58px;bottom:148px;width:min(200px,24vw);z-index:10;
  display:flex;flex-direction:column;gap:.4rem;padding:.5rem;
  background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line-m);border-radius:12px;
  box-shadow:0 0 28px rgba(255,78,200,0.07),inset 0 0 30px rgba(0,0,0,0.15);
  min-height:0;overflow:auto}
#bot{position:fixed;left:12px;right:12px;bottom:10px;height:128px;z-index:10;
  display:grid;grid-template-columns:1fr auto;gap:0;
  background:var(--glass-hi);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:12px;
  box-shadow:0 0 28px rgba(64,240,255,0.06);min-height:0;overflow:hidden}

.sec{border:1px solid rgba(100,200,255,0.14);background:rgba(0,0,0,0.22);
  border-radius:8px;padding:.42rem .48rem}
.sec-h{font-size:.52rem;letter-spacing:.16em;font-weight:700;color:#8ec8e8;margin-bottom:.32rem;
  display:flex;align-items:center;gap:.3rem;text-shadow:0 0 8px rgba(64,240,255,.35)}
.sec-h::before{content:"";width:5px;height:5px;background:var(--cyan);border-radius:1px;box-shadow:0 0 8px var(--cyan)}
.row{display:flex;flex-wrap:wrap;gap:.28rem;align-items:center}
button,.filebtn{appearance:none;background:rgba(8,16,28,0.55);border:1px solid rgba(120,220,255,.38);
  color:#dff;padding:.3rem .5rem;border-radius:6px;cursor:pointer;font-size:.6rem;
  letter-spacing:.04em;transition:border-color .12s,box-shadow .12s}
button:hover,.filebtn:hover{border-color:#9ff;box-shadow:0 0 12px rgba(100,220,255,.28)}
button.primary{border-color:rgba(255,106,213,.75);color:#ffe8f8;box-shadow:0 0 14px rgba(255,80,200,.3)}
button.ghost{border-color:rgba(255,255,255,.18);color:#9ab}
button:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
input[type=file]{display:none}
.filebtn{display:inline-flex;align-items:center}
textarea{width:100%;min-height:68px;max-height:20vh;background:rgba(0,0,0,0.45);
  border:1px solid rgba(80,140,200,0.25);color:#eef;border-radius:6px;
  padding:.38rem .42rem;font:0.58rem/1.35 ui-monospace,Menlo,monospace;resize:vertical}
textarea:focus{outline:none;border-color:#ff66cc;box-shadow:0 0 10px rgba(255,80,200,.2)}
.hint{font-size:.5rem;color:#4a6078;margin-top:.18rem}
#dropzone.drag{border-color:var(--admit)!important;box-shadow:0 0 18px rgba(125,255,176,.3)}

#pipeline{margin-top:.12rem}
.pipe-track{display:flex;gap:.18rem;flex-wrap:wrap}
.pipe-st{padding:.12rem .28rem;border:1px solid rgba(100,160,200,0.18);border-radius:4px;
  background:transparent;font-size:.44rem;letter-spacing:.1em;color:#3a5060;transition:all .15s}
.pipe-st.on{border-color:rgba(64,240,255,.55);color:var(--cyan);text-shadow:0 0 8px rgba(64,240,255,.5)}
.pipe-st.done{border-color:rgba(125,255,176,.28);color:#5a8}

.metric-row{display:flex;justify-content:space-between;align-items:baseline;padding:.16rem 0;
  border-bottom:1px solid rgba(255,255,255,.05);font-size:.6rem;font-family:ui-monospace,monospace}
.metric-row .k{color:var(--mute);letter-spacing:.06em;font-size:.5rem}
.metric-row .v{font-weight:700;color:var(--ink)}
.metric-row .v.a{color:var(--admit)}.metric-row .v.r{color:var(--refuse)}
.metric-row .v.on{color:var(--admit)}.metric-row .v.off{color:var(--refuse)}

#log-wrap{padding:.38rem .5rem;min-width:0;display:flex;flex-direction:column;min-height:0}
#log{flex:1;overflow:auto;font-family:ui-monospace,Menlo,monospace;font-size:.56rem;line-height:1.5;min-height:0}
#log .ev{display:grid;grid-template-columns:58px 88px 1fr auto;gap:.4rem;padding:.06rem .18rem;
  border-radius:3px;cursor:pointer;color:#8aa8c0}
#log .ev:hover,#log .ev.focus{background:rgba(64,240,255,.08);color:var(--ink)}
#log .ev .t{color:#5a7088}#log .ev .d.a{color:var(--admit)}#log .ev .d.r{color:var(--refuse)}
#log .ev .c{color:#4a6078;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

#chips{display:flex;flex-direction:column;justify-content:stretch;
  border-left:1px solid rgba(100,200,255,0.14);width:200px}
.chip-btn{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;
  padding:.4rem .65rem;border:0;border-radius:0;background:transparent;cursor:pointer;text-align:left}
.chip-btn + .chip-btn{border-top:1px solid rgba(100,200,255,0.12)}
.chip-btn:hover{background:rgba(255,255,255,.04)}
.chip-btn .lbl{font-size:.48rem;letter-spacing:.14em;font-weight:700}
.chip-btn.a .lbl{color:var(--admit);text-shadow:0 0 10px rgba(125,255,176,.4)}
.chip-btn.r .lbl{color:var(--refuse);text-shadow:0 0 10px rgba(255,106,213,.4)}
.chip-btn .num{font-size:1.1rem;font-weight:800;font-family:ui-monospace,monospace;line-height:1.1;margin-top:.08rem}
.chip-btn.a .num{color:var(--admit)}.chip-btn.r .num{color:var(--refuse)}
.chip-btn .sub{font-size:.46rem;color:#4a6078;margin-top:.06rem}

.pan-float{position:fixed;right:14px;top:58px;z-index:11;pointer-events:none;
  font-size:.46rem;color:rgba(100,160,200,0.55);font-family:ui-monospace,monospace;letter-spacing:.04em;
  text-shadow:0 0 6px rgba(0,0,0,.9)}
.pan-float button,#resetView{pointer-events:auto;appearance:none;
  background:rgba(6,12,22,0.45);border:1px solid rgba(64,240,255,0.35);
  color:#8ec8e8;font-size:.46rem;letter-spacing:.1em;padding:.16rem .38rem;border-radius:6px;
  cursor:pointer;margin-left:.3rem;backdrop-filter:blur(8px)}
.pan-float button:hover,#resetView:hover{border-color:#9ff;color:#dff;box-shadow:0 0 10px rgba(64,240,255,.25)}

#drawer{position:fixed;right:12px;bottom:148px;top:58px;width:min(320px,88vw);z-index:20;
  background:rgba(6,10,18,0.88);backdrop-filter:blur(14px);border:1px solid var(--line-m);
  border-radius:12px;transform:translateX(110%);transition:transform .2s;
  display:flex;flex-direction:column;padding:.55rem;box-shadow:0 0 40px rgba(255,78,200,0.12)}
#drawer.open{transform:translateX(0)}
#drawer h3{font-size:.56rem;letter-spacing:.14em;margin-bottom:.4rem}
#drawer .close{position:absolute;top:.4rem;right:.5rem;font-size:.7rem;background:transparent;border:0;color:#9ab;cursor:pointer}
#drawer .list{flex:1;overflow:auto}
#drawer .item{font-size:.58rem;padding:.3rem .25rem;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
#drawer .item:hover{background:rgba(255,106,213,.08)}
#drawer .item .meta{font-size:.48rem;color:#4a6078;margin-top:.08rem;font-family:ui-monospace,monospace}

#tip{position:fixed;z-index:30;pointer-events:none;display:none;max-width:280px;
  background:rgba(4,8,16,.9);border:1px solid var(--line-c);border-radius:8px;
  padding:.42rem .52rem;font-size:.6rem;box-shadow:0 8px 28px rgba(0,0,0,.6);backdrop-filter:blur(10px)}
#tip b{display:block;margin-bottom:.12rem;letter-spacing:.06em}
#tip.admit b{color:var(--admit)}#tip.refuse b{color:var(--refuse)}

@media(max-width:900px){
  #left{width:min(210px,36vw)}
  #right{width:min(170px,30vw)}
  .law{display:none}
}
@media(max-width:640px){
  #left,#right{position:fixed;top:auto;bottom:148px;height:auto;max-height:28vh;width:calc(50% - 16px)}
  #left{left:8px}#right{right:8px}
  #top{border-radius:12px;flex-wrap:wrap;height:auto}
  #chips{width:140px}
}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<header id="top">
  <div class="title">SERAPHIM DESK</div>
  <div class="chips">
    <span class="chip off">OFFLINE</span>
    <span class="chip live" id="chipGate">GATE LIVE</span>
    <span class="chip hex">HEX ENGINE</span>
  </div>
  <div class="metrics mono" id="topMetrics">
    <span>n <b id="mN">0</b></span>
    <span class="a">crystallize <b id="mA">0</b></span>
    <span class="v">vaporize <b id="mR">0</b></span>
    <span>C/I% <b id="mCI">—</b></span>
    <span id="mSHWrap" class="seal-off">S<sub>H</sub> <b id="mSH">OFF</b></span>
  </div>
  <div class="law"><b>S<sub>H</sub>=S<sub>solv</sub>·R<sub>H</sub></b></div>
</header>

<aside id="left">
  <div class="sec" id="dropzone">
    <div class="sec-h">INTAKE</div>
    <div class="row" style="margin-bottom:.32rem">
      <label class="filebtn">Drop / file<input type="file" id="file" accept=".csv,.tsv,.json,.jsonl,.txt,.md,.ndjson"/></label>
      <button class="primary" id="run" title="Cmd/Ctrl+Enter">Sort</button>
      <button id="demo">Demo</button>
      <button class="ghost" id="clear">Clear</button>
    </div>
    <textarea id="paste" placeholder="CSV / TSV / JSON / JSONL / TXT…"></textarea>
    <div class="row" style="margin-top:.32rem">
      <button id="dlJson" disabled>JSON</button>
      <button id="dlCsv" disabled>CSV</button>
    </div>
    <div class="hint">⌘/Ctrl+Enter</div>
    <div id="pipeline">
      <div class="pipe-track">
        <div class="pipe-st" data-st="field">FIELD</div>
        <div class="pipe-st" data-st="funnel">FUNNEL</div>
        <div class="pipe-st" data-st="core">CORE</div>
        <div class="pipe-st" data-st="verdict">VERDICT</div>
      </div>
    </div>
  </div>
</aside>

<aside id="right">
  <div class="sec">
    <div class="sec-h">LIVE METRICS</div>
    <div class="metric-row"><span class="k">n</span><span class="v" id="rN">0</span></div>
    <div class="metric-row"><span class="k">crystallized</span><span class="v a" id="rA">0</span></div>
    <div class="metric-row"><span class="k">vaporized</span><span class="v r" id="rR">0</span></div>
    <div class="metric-row"><span class="k">C/I%</span><span class="v" id="rCI">—</span></div>
    <div class="metric-row"><span class="k">S<sub>H</sub></span><span class="v off" id="rSH">OFF</span></div>
    <div class="metric-row"><span class="k">last cause</span><span class="v" id="rCause" style="font-size:.48rem;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">—</span></div>
  </div>
</aside>

<div class="pan-float">drag · wheel · dbl-click <button type="button" id="resetView">RESET VIEW</button></div>

<footer id="bot">
  <div id="log-wrap">
    <div class="sec-h" style="margin-bottom:.18rem">ACTIVITY LOG</div>
    <div id="log"></div>
  </div>
  <div id="chips">
    <button class="chip-btn a" id="chipA" title="Open crystallize list">
      <span class="lbl">CRYSTALLIZE</span>
      <span class="num" id="chipAN">0</span>
      <span class="sub">click → list</span>
    </button>
    <button class="chip-btn r" id="chipR" title="Open vaporize list">
      <span class="lbl">VAPORIZE</span>
      <span class="num" id="chipRN">0</span>
      <span class="sub">click → list</span>
    </button>
  </div>
</footer>

<div id="drawer">
  <button class="close" id="drawerClose">✕</button>
  <h3 id="drawerTitle">LIST</h3>
  <div class="list" id="drawerList"></div>
</div>
<div id="tip"></div>

<script id="app">
/* ========== GATE (offline Headroom × Seraphim) ========== */
const CAP = 4000;
const CORE_TOKENS = ["magpie","gr-21","gr21","dr4g0n","dragon","ch4r0n","charon","headroom","seraphim","howard","tripleecho","farseer","chimera","residual","solvency","claimed","interior","vesica","lynchpin","lean","feec","ppa","uspto","monsters","gqc","walle","ceilinggate","hopf","axi","pulse","formal","patent","coherence","ledger","witness","grimm","jones","refuse","admission","core-ip"];
const KIND_COST = {
  folder:[0.5,0.2,0.1,0.1], doc:[2,1.5,0.8,0.5], sheet:[2.5,2,1,0.6], slides:[3,2,1.2,0.8],
  pdf:[3.5,2.5,1.5,1], docx:[3,2,1.2,0.8], xlsx:[2.5,2,1,0.6], image:[1.5,3,1,0.8],
  video:[4,5,2,1.5], code:[2,1,0.6,0.4], text:[1,0.8,0.4,0.3], json:[1,0.8,0.4,0.3],
  csv:[1.2,1,0.5,0.3], html:[1.5,1,0.5,0.4], archive:[4,4,1.5,1.2], other:[2,2,1,0.7]
};
const PHRASE_BIAS = {patent:-0.2,"core-ip":-0.4,headroom:-0.5,formal:-0.3,gov:0.1,commerce:0.3,archive:0.6,brief:-0.1,ledger:-0.2,noise:1.2,plain:0.2,spam:1.0,grocery:0.9,vacation:0.5,wallpaper:0.4,newsletter:0.8,standup:0.3};

function fnv1a(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function shaHex(str,n=24){let h=fnv1a(str);let s=h.toString(16).padStart(8,"0");for(let i=0;i<4;i++){h=Math.imul(h^(s.length+i*17),16777619)>>>0;s+=h.toString(16).padStart(8,"0");}return s.slice(0,n);}

class RV{
  constructor(c=0,m=0,p=0,q=0){this.compute=+c;this.memory=+m;this.power=+p;this.thermal=+q;}
  add(o){return new RV(this.compute+o.compute,this.memory+o.memory,this.power+o.power,this.thermal+o.thermal);}
  sub(o){return new RV(this.compute-o.compute,this.memory-o.memory,this.power-o.power,this.thermal-o.thermal);}
  mul(s){return new RV(this.compute*s,this.memory*s,this.power*s,this.thermal*s);}
  clamp(){return new RV(Math.max(0,this.compute),Math.max(0,this.memory),Math.max(0,this.power),Math.max(0,this.thermal));}
  leq(o){return this.compute<=o.compute+1e-15&&this.memory<=o.memory+1e-15&&this.power<=o.power+1e-15&&this.thermal<=o.thermal+1e-15;}
  sum(){return this.compute+this.memory+this.power+this.thermal;}
  toObj(){return{compute:this.compute,memory:this.memory,power:this.power,thermal:this.thermal};}
}

function affinity(t){t=(t||"").toLowerCase();return CORE_TOKENS.filter(x=>t.includes(x));}
function guessKind(text,kindHint){
  if(kindHint&&KIND_COST[kindHint])return kindHint;
  const l=(text||"").toLowerCase();
  for(const [e,k] of [[".pdf","pdf"],[".docx","docx"],[".xlsx","xlsx"],[".csv","csv"],[".json","json"],[".py","code"],[".ts","code"],[".js","code"],[".html","html"],[".png","image"],[".jpg","image"],[".gif","image"],[".mp4","video"],[".zip","archive"],[".md","text"]])
    if(l.includes(e))return k;
  if(/sheet|spreadsheet|ledger/.test(l))return"sheet";
  if(/slide|deck|pitch/.test(l))return"slides";
  if(/folder|dir|vault/.test(l))return"folder";
  if(/patent|ppa|formal|brief/.test(l))return"doc";
  return"other";
}
function guessPhrase(text){const l=(text||"").toLowerCase();for(const k of Object.keys(PHRASE_BIAS)){if(l.includes(k)||l.includes(k.replace("-"," ")))return k;}return"plain";}

function howardOK(pairs,eps=0.15){
  if(!pairs||!pairs.length)return{R_H:true,r_h:0,lam:1};
  let num=0,den=0;
  for(const [d,dk] of pairs){num+=d*dk;den+=dk*dk;}
  const lam=den>0?Math.max(0,num/(den+1e-18)):1;
  let ss=0;for(const [d,dk] of pairs){const r=d-lam*dk;ss+=r*r;}
  const r_h=Math.sqrt(ss/pairs.length);
  return{R_H:Math.abs(r_h)<=eps,r_h,lam};
}

function pairsFor(text,id){
  const hits=affinity(text);
  const h=fnv1a(String(id||text||""));
  const pairs=[];
  if(!hits.length){
    const d=0.4+(h%100)/200, dk=0.05+(h%50)/500;
    pairs.push([d,dk],[d*0.7,dk*1.4]);
  }else{
    const aff=Math.min(1,hits.length/3);
    for(let i=0;i<Math.min(hits.length,6);i++){
      const th=fnv1a(hits[i]);
      let d=0.05+(th%40)/400, dk=0.05+((h^th)%40)/400;
      if(aff>0.3)dk=d/Math.max(0.5,0.85+0.1*i);
      pairs.push([d,dk]);
    }
  }
  return pairs;
}

function claimR(text,kindHint){
  const kind=guessKind(text,kindHint);
  const phrase=guessPhrase(text);
  const base=KIND_COST[kind]||KIND_COST.other;
  const bias=PHRASE_BIAS[phrase]??0.2;
  const toks=affinity(text);
  const aff=Math.min(1,toks.length/3);
  let scale=Math.max(0.25,1+bias-0.55*aff);
  scale*=1+Math.min(1.5,(text||"").length/80)*0.15;
  return{R:new RV(base[0]*scale,base[1]*scale,base[2]*scale,base[3]*scale),kind,phrase,toks,aff};
}

class Seraphim{
  constructor(){this.dim=4;this.Ts=0.05;this.Kr=8;this.eta=1e-4;this.e=[0,0,0,0];this.steps=0;}
  step(innov){
    if(innov)for(let i=0;i<this.dim;i++)this.e[i]+=(innov[i]||0);
    const a=1-this.Ts*this.Kr;
    const ne=[];
    for(let i=0;i<this.dim;i++){
      const noise=this.eta*Math.sin(0.17*(this.steps+i+1));
      ne.push(a*this.e[i]+noise);
    }
    this.e=ne;this.steps++;
    return this.e.reduce((s,x)=>s+x*x,0);
  }
}

class Controller{
  constructor(){
    this.I=new RV(120,120,100,100);
    this.C=new RV();
    this.ser=new Seraphim();
    this.chain=["HEADROOM_SEAL_v1"];
    this.eps=0.15;
    this.admits=0;this.refuses=0;
    this.solvPass=0;this.rhFail=0;
  }
  get interior(){return this.I.sub(this.C).clamp();}
  evaluate(text,id,kindHint){
    const {R,kind,phrase,toks,aff}=claimR(text,kindHint);
    const how=howardOK(pairsFor(text,id),this.eps);
    const interior=this.interior;
    const S_solv=R.leq(interior);
    const R_H=how.R_H;
    const S_H=S_solv&&R_H;
    if(S_solv)this.solvPass++;
    if(!R_H)this.rhFail++;
    let decision="refuse",cause="DISSOLVE:residual";
    if(S_H){this.C=this.C.add(R);this.admits++;decision="admit";cause="CRYSTALLIZE";}
    else{this.refuses++;if(!S_solv&&!R_H)cause="DISSOLVE:insolvence+residual";else if(!S_solv)cause="DISSOLVE:insolvence";}
    const innov=[how.r_h*0.01,(S_solv?0:1)*0.02,(R_H?0:1)*0.02,(1-aff)*0.01];
    const V=this.ser.step(innov);
    const audit=shaHex(JSON.stringify({id,decision,S_H,prev:this.chain.at(-1),ppa:"Headroom PPA 64/150,688"}));
    this.chain.push(audit);
    if((this.admits+this.refuses)%40===0&&this.admits+this.refuses>0){
      this.C=this.C.mul(0.65).clamp();
    }
    const cPct=this.I.sum()>0?(this.C.sum()/this.I.sum())*100:0;
    return{id:String(id),t:String(text).slice(0,400),decision,S_solv,R_H,S_H,cause,seraphim_V:V,audit,R:R.toObj(),kind,phrase,aff,toks,r_H:how.r_h,interior:interior.toObj(),cPct};
  }
}

function parseDump(name,text){
  const items=[]; const n=(name||"").toLowerCase();
  const push=(id,t,kind)=>{const s=String(t||"").trim();if(s)items.push({id:String(id),text:s,kind:kind||""});};
  const capped=()=>{if(items.length>CAP){items.length=CAP;return true;}return false;};
  try{
    if(n.endsWith(".json")||(/^\s*[\[{]/.test(text)&&!n.endsWith(".jsonl")&&!n.endsWith(".ndjson"))){
      const j=JSON.parse(text);
      const arr=Array.isArray(j)?j:(j.items||j.rows||j.data||j.lines||j.entries||[]);
      if(Array.isArray(arr)&&arr.length){
        arr.forEach((row,i)=>{
          if(typeof row==="string")push(i+1,row);
          else if(row&&typeof row==="object")push(row.id||row.ID||(i+1),row.title||row.text||row.name||row.label||row.item||row.content||JSON.stringify(row),row.kind||row.type||"");
        });
        capped();return items;
      }
      if(j&&typeof j==="object"&&(j.text||j.t)){push(j.id||0,j.text||j.t,j.kind);return items;}
    }
  }catch(_){}
  if(n.endsWith(".jsonl")||n.endsWith(".ndjson")||(/^\s*\{/.test(text)&&text.includes("\n{"))){
    text.split(/\r?\n/).forEach((line,i)=>{
      if(!line.trim())return;
      try{const o=JSON.parse(line);if(typeof o==="string")push(i+1,o);else push(o.id||i+1,o.title||o.text||o.name||line,o.kind);}catch{push(i+1,line);}
    });
    capped();return items;
  }
  if(n.endsWith(".csv")||n.endsWith(".tsv")||/(^|\n)[^,\n]*,[^,\n]+/.test(text)||text.includes("\t")){
    const delim=n.endsWith(".tsv")||(!text.includes(",")&&text.includes("\t"))?"\t":",";
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    if(lines.length){
      const split=(line)=>{
        const out=[];let cur="",q=false;
        for(let i=0;i<line.length;i++){
          const c=line[i];
          if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
          else if(c===delim&&!q){out.push(cur);cur="";}
          else cur+=c;
        }
        out.push(cur);return out.map(x=>x.trim());
      };
      const headers=split(lines[0]).map(h=>h.replace(/^"|"$/g,""));
      const low=headers.map(h=>h.toLowerCase());
      const hasHeader=low.some(h=>/^(id|title|name|text|t|kind|type|label|item|content|line)$/.test(h));
      const ti=Math.max(0,low.findIndex(h=>/title|name|text|file|label|item|content|line/.test(h)));
      const ii=low.findIndex(h=>/^id$/.test(h));
      const ki=low.findIndex(h=>/kind|type/.test(h));
      const start=hasHeader?1:0;
      for(let i=start;i<lines.length;i++){
        const cols=split(lines[i]).map(c=>c.replace(/^"|"$/g,""));
        if(!cols.some(Boolean))continue;
        if(hasHeader)push(ii>=0&&cols[ii]?cols[ii]:(i),cols[ti]||cols.filter(Boolean).join(" · "),ki>=0?cols[ki]:"");
        else if(cols.length===1)push(i,cols[0]);
        else push(cols[0],cols.slice(1).join(" · "));
        if(capped())break;
      }
      if(items.length)return items;
    }
  }
  text.split(/\r?\n/).forEach((line,i)=>{const s=line.trim();if(!s||s.startsWith("#"))return;push(i+1,s);});
  capped();return items;
}

function seedField(n){
  field.length=0;
  const N=Math.min(Math.max(n,4200),7200);
  for(let i=0;i<N;i++){
    // panel index 0,2,4 = starfield wedges (top / BL / BR)
    const panel= (i%3)*2;
    field.push({
      a:Math.random()*Math.PI*2,
      b:(Math.random()-0.5)*Math.PI,
      r:0.42+Math.random()*0.72,
      tw:Math.random()*Math.PI*2,
      tws:1.6+Math.random()*3.8,
      funnel:i%3,
      phase:Math.random()*10,
      layer:Math.random(),
      sz:0.55+Math.random()*1.6,

    });

}

function hsl(h,s,l,a=1){
  // hard cap lightness so additive never clips to white
  const L=Math.min(75,Math.max(0,l));
  return`hsla(${((h%360)+360)%360},${s}%,${L}%,${a})`;
}

function project(x,y,z,cx,cy,s){
  const yaw=cam.yaw, pitch=cam.pitch;
  const cosy=Math.cos(yaw),siny=Math.sin(yaw);
  const cosp=Math.cos(pitch),sinp=Math.sin(pitch);
  let x1=x*cosy-z*siny;
  let z1=x*siny+z*cosy;
  let y1=y*cosp-z1*sinp;
  z1=y*sinp+z1*cosp;
  const px=cx+(x1+cam.x)*s;
  const py=cy+(-y1+cam.y)*s*0.92+z1*s*0.12;
  return[px,py,z1];
}

function drawHexFrame(cx,cy,s,t){
  const verts=[];
  for(let i=0;i<6;i++){
    const a=-Math.PI/2+i*Math.PI/3;
    const [px,py]=project(Math.cos(a)*1.05,Math.sin(a)*0.95,0,cx,cy,s);
    verts.push([px,py]);
  }
  hexVertsCache=verts;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  // dense rainbow hex rim
  for(let i=0;i<6;i++){
    const a=verts[i],b=verts[(i+1)%6];
    const g=ctx.createLinearGradient(a[0],a[1],b[0],b[1]);
    g.addColorStop(0,hsl(i*60+t*35,100,58,0.95));
    g.addColorStop(0.5,hsl(i*60+30+t*35,100,68,0.98));
    g.addColorStop(1,hsl((i+1)*60+t*35,100,58,0.95));
    ctx.strokeStyle=g;ctx.lineWidth=3.6;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    ctx.lineWidth=9;ctx.strokeStyle=hsl(i*60+t*35,100,48,0.14);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
  }
  // spoke dividers — NO white wash fills; panels stay void-black except starfield later
  for(let i=0;i<6;i++){
    const v=verts[i];
    ctx.strokeStyle=hsl(i*60+t*40,100,62,0.22);
    ctx.lineWidth=1.05;
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(v[0],v[1]);ctx.stroke();
  }
  // outer ghost hex
  for(let i=0;i<6;i++){
    const a=verts[i],b=verts[(i+1)%6];
    ctx.strokeStyle=hsl(i*60+t*35,100,62,0.18);ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo((a[0]-cx)*1.06+cx,(a[1]-cy)*1.06+cy);
    ctx.lineTo((b[0]-cx)*1.06+cx,(b[1]-cy)*1.06+cy);
    ctx.stroke();
  }
  for(let i=0;i<6;i++){
    const v=verts[i];
    const pulse=0.55+0.45*Math.sin(t*3+i);
    ctx.fillStyle=hsl(i*60+t*40,100,68,0.55*pulse);
    ctx.beginPath();ctx.arc(v[0],v[1],2.0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
  return verts;
}

function drawStarfieldInPanels(cx,cy,s,t,verts){
  if(!verts||verts.length<6)return;
  // Star panels ONLY: wedges 0,2,4 (top / bottom-left / bottom-right) — blizzard confined
  ctx.save();
  for(let i=0;i<6;i+=2){
    const v=verts[i], v2=verts[(i+1)%6], v3=verts[(i+2)%6];
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(v[0],v[1]);
    ctx.lineTo(v2[0],v2[1]);
    ctx.lineTo(v3[0],v3[1]);
    ctx.closePath();
    ctx.clip();
    // soft dark void under stars (never white fill)
    ctx.globalCompositeOperation="source-over";
    ctx.fillStyle="rgba(0,0,0,0.15)";
    ctx.fill();
    ctx.globalCompositeOperation="lighter";
    // dense blizzard — only inside this clip
    const count=Math.floor(field.length/3);
    const off=(i/2)*count;
    for(let k=0;k<count;k++){
      const p=field[off+k];
      if(!p)continue;
      // polar scatter inside panel wedge
      const ang0=Math.atan2(v[1]-cy,v[0]-cx);
      const ang1=Math.atan2(v3[1]-cy,v3[0]-cx);
      let span=ang1-ang0; while(span<=0)span+=Math.PI*2;
      const u=(k/count + p.phase*0.01 + t*0.008)%1;
      const ang=ang0+span*(0.08+u*0.84);
      const rr=s*(0.38+0.58*((p.r-0.42)/0.72));
      const px=cx+Math.cos(ang)*rr + (p.layer-0.5)*4;
      const py=cy+Math.sin(ang)*rr + (p.layer-0.5)*3;
      const tw=0.35+0.65*Math.abs(Math.sin(t*p.tws+p.tw));
      const sz=(p.sz||1)*(0.7+1.1*p.layer*tw);
      // white stars but alpha-capped — blizzard not flood
      ctx.fillStyle=`rgba(220,235,255,${0.18+0.42*tw*(0.4+p.layer*0.5)})`;
      ctx.fillRect(px,py,sz,sz);
    }
    ctx.restore();
  }
  ctx.restore();
}

      ctx.lineWidth=0.6;
      ctx.beginPath();
      for(let i=0;i<=rings;i++){

    }
    ctx.lineWidth=6.5;ctx.strokeStyle=beamGrad;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(tx,ty);ctx.lineTo(bx,by);ctx.stroke();
    // soft colored core line (not white)

function drawSphereWire(cx,cy,s,t){
  const R=0.64;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(let i=0;i<20;i++){
    const lat=(i/19-0.5)*Math.PI*0.95;
    ctx.strokeStyle=hsl((i*26+t*48)%360,100,62,0.42);
    ctx.lineWidth=0.7;
    ctx.beginPath();
    let first=true;
    for(let j=0;j<=72;j++){
      const u=j/72*Math.PI*2+t*0.35;
      const x=Math.cos(lat)*Math.cos(u)*R;
      const y=Math.sin(lat)*R;
      const z=Math.cos(lat)*Math.sin(u)*R;
      const [px,py,d]=project(x,y,z,cx,cy,s);
      if(d<-0.35){first=true;continue;}
      if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  for(let i=0;i<18;i++){
    const lon=i/18*Math.PI;
    ctx.strokeStyle=hsl((i*30+t*40)%360,100,60,0.36);
    ctx.lineWidth=0.65;
    ctx.beginPath();
    let first=true;
    for(let j=0;j<=64;j++){
      const lat=-Math.PI/2+j/64*Math.PI;
      const x=Math.cos(lat)*Math.cos(lon+t*0.28)*R;
      const y=Math.sin(lat)*R;
      const z=Math.cos(lat)*Math.sin(lon+t*0.28)*R;
      const [px,py,d]=project(x,y,z,cx,cy,s);
      if(d<-0.35){first=true;continue;}
      if(first){ctx.moveTo(px,py);first=false;}else ctx.lineTo(px,py);
    }
    ctx.stroke();
  }
  // subtle tint glass — no white core
  const [ex,ey]=project(0,0,0,cx,cy,s);
  const g=ctx.createRadialGradient(ex,ey,s*R*0.2,ex,ey,s*R*1.05);
  g.addColorStop(0,"rgba(40,180,220,0.035)");
  g.addColorStop(0.5,"rgba(200,60,160,0.03)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(ex,ey,s*R*1.05,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function ensureBlobs(verdicts){
  blobs.length=0;
  const admits=verdicts.filter(v=>v.decision==="admit");
  const refuses=verdicts.filter(v=>v.decision==="refuse");
  const mk=(count,hue0,hue1,side,mass)=>{
    const n=Math.max(5,Math.min(14,3+Math.floor(count/1.5*mass)));
    for(let i=0;i<n;i++){
      blobs.push({
        side, hue:hue0+(hue1-hue0)*(i/(n-1||1)),
        a:side*0.55+(Math.random()-0.5)*0.9,
        b:(Math.random()-0.5)*0.95,
        r:0.12+Math.random()*0.26,
        size:(0.12+Math.random()*0.15+(count>3?0.03:0))*mass,
        spin:0.15+Math.random()*0.45,
        merge:Math.random()*Math.PI*2,
        id:null
      });
    }
  };
  mk(admits.length,140,190,-1,1);
  mk(Math.max(refuses.length,admits.length),310,25,1,1.35);
  const pool=[...admits,...refuses];
  pool.forEach((v,i)=>{if(blobs[i])blobs[i].id=v.id;});
}

function drawLava(cx,cy,s,t){

      blobs.push({side:refuse?1:-1,hue:refuse?310+(i-4)*12:145+i*10,
        a:(refuse?0.55:-0.55)+Math.random()*0.4,b:(i%3-1)*0.28,r:0.16+i*0.01,
        size:(refuse?0.15:0.11)+i*0.01,spin:0.18+i*0.03,merge:i*0.7,id:null});
    }
  }
  // PASS 1: soft glow with lighter (low alpha)
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const b of blobs){
    b.a+=0.0035*b.spin;
    const merge=0.55+0.45*Math.sin(t*0.85+b.merge);
    const orbit=b.r*(0.75+0.4*merge);
    const ang=b.a+t*b.spin;
    const lat=b.b+0.18*Math.sin(t*0.55+b.merge);
    const x=Math.cos(lat)*Math.cos(ang)*orbit + b.side*0.14;
    const y=Math.sin(lat)*orbit*0.9 + Math.sin(t*0.4+b.merge)*0.03;
    const z=Math.cos(lat)*Math.sin(ang)*orbit;
    const [px,py,d]=project(x,y,z,cx,cy,s);
    if(d<-0.45){b._px=null;continue;}
    const focus=focusId!=null&&b.id!=null&&String(b.id)===String(focusId);
    const rad=b.size*s*(1.55+0.35*merge)*(1+0.12*sealPulse)*(focus?1.3:1);
    const hue=b.hue+10*Math.sin(t+b.merge);
    const boost=b.side>0?1.15:1;
    const rad2=rad*boost;
    let g=ctx.createRadialGradient(px,py,0,px,py,rad2*1.9);
    // halo only — L≤52 so stacking stays color
    g.addColorStop(0,hsl(hue,100,b.side>0?48:44,0.22));
    g.addColorStop(0.5,hsl(hue+(b.side>0?25:12),100,38,0.1));
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,rad2*1.9,0,Math.PI*2);ctx.fill();
    b._px=px;b._py=py;b._rad=rad2;b._hue=hue;b._focus=focus;
  }
  ctx.restore();

  // PASS 2: color cores with source-over — NO additive white crush; L≤72
  ctx.save();
  ctx.globalCompositeOperation="source-over";
  for(const b of blobs){
    if(b._px==null)continue;
    const px=b._px,py=b._py,rad2=b._rad,hue=b._hue;
    let g=ctx.createRadialGradient(px,py,0,px,py,rad2);
    g.addColorStop(0,hsl(hue,100,b.side>0?68:64,0.88));
    g.addColorStop(0.4,hsl(hue+(b.side>0?18:10),100,52,0.55));
    g.addColorStop(0.75,hsl(hue+(b.side>0?28:14),100,40,0.22));
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,rad2,0,Math.PI*2);ctx.fill();
    if(b._focus){
      ctx.strokeStyle=hsl(hue,100,70,0.8);ctx.lineWidth=1.3;
      ctx.beginPath();ctx.arc(px,py,rad2*1.3,0,Math.PI*2);ctx.stroke();
    }
  }
  // soft merge bridges (source-over, low alpha)
  for(let i=0;i<blobs.length;i++){
    for(let j=i+1;j<blobs.length;j++){
      const a=blobs[i],b=blobs[j];
      if(a.side!==b.side||a._px==null||b._px==null)continue;
      const dist=Math.hypot(a._px-b._px,a._py-b._py);
      const lim=(a._rad+b._rad)*1.3;
      if(dist<lim){
        const midX=(a._px+b._px)/2, midY=(a._py+b._py)/2;
        const rr=(1-dist/lim)*Math.min(a._rad,b._rad)*0.9;
        const hue=(a._hue+b._hue)/2;
        const g=ctx.createRadialGradient(midX,midY,0,midX,midY,rr*2);
        g.addColorStop(0,hsl(hue,100,55,0.28));
        g.addColorStop(1,"rgba(0,0,0,0)");
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(midX,midY,rr*2,0,Math.PI*2);ctx.fill();
      }
    }
  }
  ctx.restore();
}

function drawNodes(cx,cy,s,t){
  const age=(performance.now()-sortAnimT)*0.001;
  ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const p of nodes){
    const local=age-p.delay;
    if(local<0){p._px=null;continue;}
    let px,py;
    if(local<1.15){
      const tips=[[-0.88,-0.55],[0.88,-0.55],[0,0.95]];
      const tip=tips[p.funnel];
      const [fx,fy]=project(tip[0],tip[1],0,cx,cy,s*0.95);
      const u=Math.min(1,local/1.15);
      const ease=u*u*(3-2*u);
      const [bx,by]=project(0,0,0,cx,cy,s);
      px=fx+(bx-fx)*ease; py=fy+(by-fy)*ease;
      ctx.fillStyle=hsl(p.hue,100,62,0.75);
      ctx.beginPath();ctx.arc(px,py,2.0,0,Math.PI*2);ctx.fill();
    }else{
      p.a+=0.003*p.spin;
      const sideBias=p.decision==="admit"?-0.12:0.12;
      const xx=Math.cos(p.b)*Math.cos(p.a+t*p.spin)*p.r + sideBias;
      const yy=Math.sin(p.b)*p.r*0.85;
      const zz=Math.cos(p.b)*Math.sin(p.a+t*p.spin)*p.r;
      const pr=project(xx,yy,zz,cx,cy,s);
      px=pr[0];py=pr[1];
      const focus=focusId!=null&&String(p.id)===String(focusId);
      const rad=p.size*(focus?1.7:1)*(1+0.1*sealPulse);
      const g=ctx.createRadialGradient(px,py,0,px,py,rad*2);
      g.addColorStop(0,hsl(p.hue,100,62,0.7));
      g.addColorStop(0.45,hsl(p.hue,100,48,0.28));
      g.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(px,py,rad*2,0,Math.PI*2);ctx.fill();
    }
    p._px=px;p._py=py;
  }
  ctx.restore();
}

function neonLabel(text,x,y,color,font){
  ctx.font=font||"600 11px ui-monospace, Menlo, monospace";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  // dark halo for readability on black / neon
  ctx.lineWidth=4.5;
  ctx.strokeStyle="rgba(0,0,0,0.85)";
  ctx.lineJoin="round";
  ctx.strokeText(text,x,y);
  ctx.lineWidth=2.2;
  ctx.strokeStyle="rgba(0,0,0,0.55)";
  ctx.strokeText(text,x,y);
  ctx.fillStyle=color;
  ctx.fillText(text,x,y);
}

function drawCanvasLabels(cx,cy,s,mouths,t){
  ctx.save();
  ctx.globalCompositeOperation="source-over";

  for(const m of mouths){
    let lx=m.x, ly=m.y;
    if(m.side==="tl"){lx-=10;ly-=16;}
    else if(m.side==="tr"){lx+=10;ly-=16;}
    else{ly+=18;}
    neonLabel(m.label,lx,ly,m.side==="bot"?"#ff9ad8":"#9ef0ff","600 10px ui-monospace, Menlo, monospace");
  }

  const leftX=cx-s*0.28, rightX=cx+s*0.28, midY=cy+s*0.02;
  neonLabel("CRYSTALLIZE",leftX,midY,"#7dffb0","700 12px ui-sans-serif, system-ui, sans-serif");
  neonLabel("VAPORIZE",rightX,midY,"#ff6ad5","700 12px ui-sans-serif, system-ui, sans-serif");

  const ciTxt=`C/I SEAL · ${Math.round(lastCI)}%`;
  const sealY=cy-s*0.58;
  neonLabel(ciTxt,cx,sealY,lastCI<70?"#c8ff9a":"#ffb84d","600 10px ui-monospace, Menlo, monospace");

  const uY=cy-s*0.78;
  neonLabel("UNSORTED",cx,uY,"#c8e0ff","600 9px ui-monospace, Menlo, monospace");

  ctx.restore();
}

function setPipe(stage){
  pipeStage=stage;
  document.querySelectorAll(".pipe-st").forEach(el=>{
    const st=el.dataset.st;
    el.classList.remove("on","done");
    const order=["field","funnel","core","verdict"];
    const i=order.indexOf(st), cur=order.indexOf(stage);
    if(i===cur)el.classList.add("on");
    else if(i<cur)el.classList.add("done");
  });
}

function ingestVerdicts(verdicts){
  t0=performance.now();
  sortAnimT=performance.now();
  seedField(Math.max(4200,verdicts.length*90));
  nodes.length=0;
  const VIZ_CAP=120;
  const show=verdicts.length>VIZ_CAP?verdicts.slice(0,VIZ_CAP):verdicts;
  show.forEach((v,i)=>{
    const admit=v.decision==="admit";
    nodes.push({
      v,id:v.id,decision:v.decision,
      a:Math.random()*Math.PI*2,
      b:(Math.random()-0.5)*1.0,
      r:0.1+Math.random()*0.36,
      spin:0.2+Math.random()*0.55,
      hue:admit?140+Math.random()*50:310+Math.random()*50,
      size:3.0+Math.random()*3.2,
      funnel:i%3,
      delay:Math.random()*0.55,
      _px:null,_py:null
    });
  });
  ensureBlobs(verdicts);
  sealPulse=1;
  setPipe("field");
  setTimeout(()=>setPipe("funnel"),180);
  setTimeout(()=>setPipe("core"),700);
  setTimeout(()=>setPipe("verdict"),1400);
}

function frame(now){
  const t=(now-t0)*0.001;
  cam.yaw=Math.sin(t*0.18)*0.06+(pan.dragging?0:mouse.tx*0.06);
  cam.pitch=Math.cos(t*0.14)*0.04+(pan.dragging?0:mouse.ty*0.05);
  cam.x=mouse.tx*0.02;
  cam.y=mouse.ty*0.015;
  sealPulse*=0.992;
  if(sealPulse<0.02)sealPulse=0;

  ctx.fillStyle="#000";
  ctx.fillRect(0,0,W,H);

  // orbit full-bleed — larger since no grey cell squeeze
  const s=Math.min(W,H)*0.42*cam.zoom;
  const cx=W*0.5+cam.panX+cam.x*s*0.35;
  const cy=H*0.50+cam.panY+cam.y*s*0.25;

  const verts=drawHexFrame(cx,cy,s,t);
  drawStarfieldInPanels(cx,cy,s,t,verts);
  const mouths=drawFunnelsAndBeams(cx,cy,s,t);
  drawSphereWire(cx,cy,s*0.96,t);
  drawLava(cx,cy,s*0.96,t);
  drawNodes(cx,cy,s,t);

  if(sealPulse>0.02){
    ctx.save();
    ctx.globalCompositeOperation="lighter";
    const R=s*0.52*(1+(1-sealPulse)*0.35);
    ctx.strokeStyle=hsl(130+sealPulse*30,100,62,sealPulse*0.45);
    ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.stroke();
    ctx.restore();
  }

  drawCanvasLabels(cx,cy,s,mouths,t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
seedField(4800);
setPipe("field");

/* ========== UI / PRODUCT ========== */
const $=id=>document.getElementById(id);
const tip=$("tip");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}

function hhmmss(d=new Date()){
  return[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");
}

function updateMetrics(res){
  const n=res?res.n:0;
  const a=res?res.counts.admit:0;
  const r=res?res.counts.refuse:0;
  const ci=res&&res.ciPct!=null?res.ciPct:0;
  lastCI=ci;
  const shOn=!!(res&&res.verdicts&&res.verdicts.some(v=>v.S_H));
  $("mN").textContent=n; $("rN").textContent=n;
  $("mA").textContent=a; $("rA").textContent=a; $("chipAN").textContent=a;
  $("mR").textContent=r; $("rR").textContent=r; $("chipRN").textContent=r;
  const ciStr=n?ci.toFixed(0)+"%":"—";
  $("mCI").textContent=ciStr; $("rCI").textContent=ciStr;
  const shEl=$("rSH"), shWrap=$("mSHWrap"), shB=$("mSH");
  if(shOn){
    shEl.textContent="ON"; shEl.className="v on";
    shB.textContent="ON"; shWrap.className="seal-on";
  }else{
    shEl.textContent="OFF"; shEl.className="v off";
    shB.textContent="OFF"; shWrap.className="seal-off";
  }
  const last=res&&res.verdicts.length?res.verdicts[res.verdicts.length-1]:null;
  $("rCause").textContent=last?last.cause:"—";
  $("rCause").title=last?last.cause:"";
}

function pushLog(verdicts){
  const log=$("log");
  const frag=document.createDocumentFragment();
  const now=new Date();
  const slice=verdicts.slice(-40).reverse();
  slice.forEach((v,idx)=>{
    const ev=document.createElement("div");
    ev.className="ev";
    ev.dataset.id=v.id;
    const dec=v.decision==="admit"?"CRYSTALLIZE":"VAPORIZE";
    const cls=v.decision==="admit"?"a":"r";
    const title=(v.t||"").slice(0,40);
    const t=new Date(now.getTime()-idx*320);
    ev.innerHTML=`<span class="t">${hhmmss(t)}</span><span class="d ${cls}">${dec}</span><span class="title">${esc(title)}</span><span class="c">${esc(v.cause||"")}</span>`;
    ev.onclick=()=>focusNode(v.id);
    frag.appendChild(ev);
  });
  log.innerHTML="";
  log.appendChild(frag);
}

function render(res){
  lastResult=res;
  updateMetrics(res);
  pushLog(res.verdicts);
  $("dlJson").disabled=false;$("dlCsv").disabled=false;
  ingestVerdicts(res.verdicts);
}

function focusNode(id){
  focusId=id;
  document.querySelectorAll("#log .ev").forEach(el=>{
    el.classList.toggle("focus",String(el.dataset.id)===String(id));
  });
  if(lastResult){
    const v=lastResult.verdicts.find(x=>String(x.id)===String(id));
    if(v){
      tip.style.display="block";
      tip.className=v.decision;
      tip.innerHTML=`<b>${v.decision==="admit"?"CRYSTALLIZE":"VAPORIZE"}</b>${esc(v.t.slice(0,140))}<div style="opacity:.55;margin-top:.2rem;font-size:.55rem;font-family:ui-monospace,monospace">S_solv=${v.S_solv?1:0} · R_H=${v.R_H?1:0} · S_H=${v.S_H?1:0}<br/>${esc(v.cause)}</div>`;
      tip.style.left=Math.min(innerWidth-290,Math.max(8,tipPos.x+14))+"px";
      tip.style.top=Math.min(innerHeight-110,Math.max(8,tipPos.y+14))+"px";
    }
  }
  sealPulse=Math.max(sealPulse,0.55);
}

function organize(items){
  if(!items.length)return;
  setPipe("field");
  const ctrl=new Controller();
  const verdicts=[];
  for(const it of items)verdicts.push(ctrl.evaluate(it.text,it.id,it.kind));
  const counts={admit:verdicts.filter(v=>v.decision==="admit").length,refuse:verdicts.filter(v=>v.decision==="refuse").length};
  const ciPct=ctrl.I.sum()>0?(ctrl.C.sum()/ctrl.I.sum())*100:0;
  render({
    n:verdicts.length,counts,verdicts,
    solvPass:ctrl.solvPass,rhFail:ctrl.rhFail,ciPct,
    seal:"S_H = S_solv · R_H",
    ppa:"Headroom PPA 64/150,688",
    epsilon_H:0.15,offline:true,
    stamp:new Date().toISOString(),
    seraphim_V:ctrl.ser.e.reduce((s,x)=>s+x*x,0)
  });
}

function clearAll(){
  $("paste").value="";
  lastResult=null;focusId=null;nodes.length=0;blobs.length=0;lastCI=0;
  updateMetrics(null);
  $("log").innerHTML="";
  $("dlJson").disabled=true;$("dlCsv").disabled=true;
  tip.style.display="none";
  $("drawer").classList.remove("open");
  seedField(4800);
  resetView();
  setPipe("field");
}

function openDrawer(which){
  if(!lastResult)return;
  const admit=which==="a";
  $("drawerTitle").textContent=admit?"CRYSTALLIZE":"VAPORIZE";
  $("drawerTitle").style.color=admit?"var(--admit)":"var(--refuse)";
  const list=$("drawerList");
  list.innerHTML="";
  lastResult.verdicts.filter(v=>admit?v.decision==="admit":v.decision==="refuse").forEach(v=>{
    const el=document.createElement("div");
    el.className="item";
    el.innerHTML=`${esc(v.t.slice(0,100))}<div class="meta">${esc(v.cause||"")} · ${esc(v.kind||"")}</div>`;
    el.onclick=()=>{focusNode(v.id);};
    list.appendChild(el);
  });
  $("drawer").classList.add("open");
}

$("run").onclick=()=>{
  const t=$("paste").value.trim();
  if(!t)return;
  organize(parseDump("paste.txt",t));
};
$("demo").onclick=()=>{
  $("paste").value=DEMO_CSV;
  organize(parseDump("sample_dump.csv",DEMO_CSV));
};
$("clear").onclick=clearAll;
$("file").onchange=async()=>{
  const f=$("file").files[0];if(!f)return;
  $("paste").value=await f.text();
  organize(parseDump(f.name,$("paste").value));
};
$("chipA").onclick=()=>openDrawer("a");
$("chipR").onclick=()=>openDrawer("r");
$("drawerClose").onclick=()=>$("drawer").classList.remove("open");

const dz=$("dropzone");
dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag");});
dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));
dz.addEventListener("drop",async e=>{
  e.preventDefault();dz.classList.remove("drag");
  const f=e.dataTransfer.files[0];
  if(f){$("paste").value=await f.text();organize(parseDump(f.name,$("paste").value));return;}
  const text=e.dataTransfer.getData("text/plain");
  if(text){$("paste").value=text;organize(parseDump("paste.txt",text));}
});
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();$("run").click();}
  if(e.key==="Escape"){$("drawer").classList.remove("open");tip.style.display="none";focusId=null;}
});
$("dlJson").onclick=()=>{
  if(!lastResult)return;
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(lastResult,null,2)],{type:"application/json"}));
  a.download="seraphim-organize.json";a.click();
};
$("dlCsv").onclick=()=>{
  if(!lastResult)return;
  const rows=[["id","decision","S_H","S_solv","R_H","cause","kind","audit","text"],
    ...lastResult.verdicts.map(v=>[v.id,v.decision,v.S_H,v.S_solv,v.R_H,v.cause||"",v.kind||"",v.audit,JSON.stringify(v.t)])];
  const csv=rows.map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  a.download="seraphim-organize.csv";a.click();
};

canvas.addEventListener("click",e=>{
  if(pan._suppressClick||pan.dragging||pan.moved>CLICK_PX){pan._suppressClick=false;return;}
  const x=e.clientX, y=e.clientY;
  tipPos={x:e.clientX,y:e.clientY};
  let best=null,bd=20;
  for(const p of nodes){
    if(p._px==null)continue;
    const d=Math.hypot(p._px-x,p._py-y);
    if(d<bd){bd=d;best=p;}
  }
  for(const b of blobs){
    if(b._px==null||!b.id)continue;
    const d=Math.hypot(b._px-x,b._py-y);
    if(d<(b._rad||10)+8&&d<bd){bd=d;best={id:b.id};}
  }
  if(best)focusNode(best.id);
  else{focusId=null;tip.style.display="none";}
});

// auto-demo
$("paste").value=DEMO_CSV;
organize(parseDump("sample_dump.csv",DEMO_CSV));
</script>
